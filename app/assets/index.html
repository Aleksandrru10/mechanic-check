<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Механик-чек</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><p class="eyebrow">ЛИЧНЫЙ ПОМОЩНИК</p><h1>Механик-чек</h1></div><span class="status-dot"></span></header><section id="home" class="screen"><div class="hero"><p>Проверь ремонт перед выдачей автомобиля</p><button id="new-job" class="primary">+ Начать ремонт</button></div><div class="section-title"><h2>Текущие работы</h2><span id="job-count"></span></div><div id="jobs"></div></section><section id="editor" class="screen" hidden><button class="back" id="back-home">← Все работы</button><h2>Новая работа</h2><label id="car-wrap">Автомобиль<input id="car" placeholder="Например, Kia Rio 2016"></label><label>Марка<select id="car-brand"><option value="">Другая марка</option><option value="jetour">JETOUR</option></select></label><label id="jetour-model-wrap" hidden>Модель JETOUR<select id="jetour-model"></select></label><label id="service-wrap" hidden>Регламент<select id="service-type"></select></label><label id="job-type-wrap" hidden>Что делаешь<select id="job-type"><option value="brakes">Тормозная система</option><option value="oil">Замена масла</option><option value="suspension">Подвеска</option><option value="timing">Ремень ГРМ</option><option value="battery">Аккумулятор</option><option value="custom">Другое</option></select></label><label id="custom-wrap" hidden>Название работы<input id="custom"></label><button id="create-job" class="primary wide">Создать чек-лист</button></section><section id="detail" class="screen" hidden><button class="back" id="back-detail">← Все работы</button><div id="detail-head"></div><div class="progress"><div id="progress-bar"></div></div><p id="progress-text" class="hint"></p><div id="checklist"></div><button id="finish" class="primary wide" disabled>Завершить ремонт</button><button id="delete" class="danger wide">Удалить работу</button></section><p>&#1064;&#1072;&#1073;&#1083;&#1086;&#1085;&#1099; &#1086;&#1073;&#1097;&#1080;&#1077;. &#1057;&#1074;&#1077;&#1088;&#1103;&#1081;&#1090;&#1077; &#1089; &#1088;&#1091;&#1082;&#1086;&#1074;&#1086;&#1076;&#1089;&#1090;&#1074;&#1086;&#1084; &#1072;&#1074;&#1090;&#1086;&#1084;&#1086;&#1073;&#1080;&#1083;&#1103;.</p><a href="https://appassets.androidplatform.net/check-updates">&#1055;&#1088;&#1086;&#1074;&#1077;&#1088;&#1080;&#1090;&#1100; &#1086;&#1073;&#1085;&#1086;&#1074;&#1083;&#1077;&#1085;&#1080;&#1077; GitHub</a></main><nav><button id="info">ⓘ<small>Как пользоваться</small></button></nav><div id="toast"></div><script src="mechanic.js"></script></body></html>
